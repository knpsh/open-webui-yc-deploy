version: "3.8"

services:
  yandex-proxy:
    build: ./proxy
    container_name: yandex-proxy
    restart: always
    ports:
      - "8081:8081"

  stt-proxy:
    build: ./stt-proxy
    container_name: stt-proxy
    restart: always
    ports:
      - "8082:8082"
    environment:
      - FOLDER_ID=${FOLDER_ID}
      - API_KEY=${API_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - ENABLE_OLLAMA_API=False
      - OPENAI_API_BASE_URL=http://yandex-proxy:8081/v1
      - OPENAI_API_KEY=${API_KEY}
      - IMAGES_OPENAI_API_BASE_URL=http://yandex-proxy:8081/v1
      - IMAGES_OPENAI_API_KEY=${API_KEY}
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://stt-proxy:8082/v1
      - AUDIO_STT_OPENAI_API_KEY=unused
      - ENABLE_IMAGE_GENERATION=True
      - IMAGE_GENERATION_ENGINE=openai
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_CLIENT_ID=${OIDC_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OPENID_PROVIDER_URL=${OIDC_DISCOVERY_URL}
      - OAUTH_PROVIDER_NAME=Yandex Identity Hub
      - OAUTH_SCOPES=openid email profile
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - WEBUI_URL=http://localhost:3000
    depends_on:
      - yandex-proxy
      - stt-proxy

volumes:
  open-webui:
