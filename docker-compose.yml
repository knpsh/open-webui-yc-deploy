version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  yandex-proxy:
    build: ./proxy
    container_name: yandex-proxy
    restart: always
    ports:
      - "8081:8081"
    environment:
      - FOLDER_ID=${FOLDER_ID}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT:-https://storage.yandexcloud.net}
      - REDIS_URL=redis://redis:6379/0
      - RATELIMIT_ENABLED=${RATELIMIT_ENABLED}
      - RATELIMIT_CHAT_PER_DAY=${RATELIMIT_CHAT_PER_DAY}
      - RATELIMIT_CHAT_PER_MONTH=${RATELIMIT_CHAT_PER_MONTH}
      - RATELIMIT_CHAT_TOKENS_PER_DAY=${RATELIMIT_CHAT_TOKENS_PER_DAY}
      - RATELIMIT_CHAT_TOKENS_PER_MONTH=${RATELIMIT_CHAT_TOKENS_PER_MONTH}
      - RATELIMIT_IMAGE_PER_DAY=${RATELIMIT_IMAGE_PER_DAY}
      - RATELIMIT_IMAGE_PER_MONTH=${RATELIMIT_IMAGE_PER_MONTH}
      - YANDEX_RESPONSES_BASE_URL=${YANDEX_RESPONSES_BASE_URL:-https://ai.api.cloud.yandex.net/v1}
      - YANDEX_CODE_INTERPRETER_MODEL_ID=${YANDEX_CODE_INTERPRETER_MODEL_ID:-yandex-code-interpreter}
      - YANDEX_CODE_INTERPRETER_MODEL=${YANDEX_CODE_INTERPRETER_MODEL:-qwen3-235b-a22b-fp8}
      - YANDEX_CODE_INTERPRETER_OUTPUT_PREFIX=${YANDEX_CODE_INTERPRETER_OUTPUT_PREFIX:-code-interpreter-results}
      - YANDEX_CODE_INTERPRETER_PRESIGN_EXPIRES=${YANDEX_CODE_INTERPRETER_PRESIGN_EXPIRES:-604800}
    depends_on:
      - redis

  stt-proxy:
    build: ./stt-proxy
    container_name: stt-proxy
    restart: always
    ports:
      - "8082:8082"
    environment:
      - FOLDER_ID=${FOLDER_ID}
      - API_KEY=${API_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - REDIS_URL=redis://redis:6379/0
      - RATELIMIT_ENABLED=${RATELIMIT_ENABLED}
      - RATELIMIT_STT_PER_DAY=${RATELIMIT_STT_PER_DAY}
      - RATELIMIT_STT_PER_MONTH=${RATELIMIT_STT_PER_MONTH}
    depends_on:
      - redis

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://stt-proxy:8082/v1
      - AUDIO_STT_OPENAI_API_KEY=unused
      - CODE_INTERPRETER_ENGINE=pyodide
      - ENABLE_CODE_INTERPRETER=True
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
      - ENABLE_IMAGE_GENERATION=True
      - ENABLE_LOGIN_FORM=false
      - ENABLE_OAUTH_SIGNUP=true
      - ENABLE_OLLAMA_API=False
      - ENABLE_SIGNUP=false
      - ENABLE_WEB_SEARCH=True
      - IMAGE_GENERATION_ENGINE=openai
      - IMAGES_OPENAI_API_BASE_URL=http://yandex-proxy:8081/v1
      - IMAGES_OPENAI_API_KEY=${API_KEY}
      - OAUTH_CLIENT_ID=${OIDC_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OAUTH_CODE_CHALLENGE_METHOD=S256
      - OAUTH_EMAIL_CLAIM=preferred_username
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - OAUTH_PROVIDER_NAME=Yandex Identity Hub
      - OAUTH_SCOPES=openid email profile
      - OPENAI_API_BASE_URL=http://yandex-proxy:8081/v1
      - OPENAI_API_KEY=${API_KEY}
      - OPENID_PROVIDER_URL=${OIDC_DISCOVERY_URL}
      - WEB_SEARCH_ENGINE="yandex"
      - WEBUI_URL=http://localhost:3000
      - YANDEX_WEB_SEARCH_API_KEY=${API_KEY}
    depends_on:
      - yandex-proxy
      - stt-proxy

volumes:
  open-webui:
  redis-data:
